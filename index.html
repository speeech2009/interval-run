<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --run: #FF2D2D;
    --jog: #FF8C00;
    --rest: #00C87A;
    --bg: #0D0D0D;
    --card: #181818;
    --card2: #222;
    --text: #F5F5F5;
    --muted: #666;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 90px;
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 24px; }

  /* BOTTOM NAV */
  .tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: #111;
    border-top: 1px solid #2a2a2a;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 100; max-width: 480px; margin: 0 auto;
  }
  .tab {
    flex: 1; padding: 8px 4px; border-radius: 0; border: none;
    background: none; color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 10px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tab .tab-icon { font-size: 22px; line-height: 1; }
  .tab.active { color: var(--text); }
  .tab.active .tab-icon { transform: scale(1.15); }

  /* CARDS */
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
  }

  /* SETS ROW */
  .row { display: flex; align-items: center; justify-content: space-between; }
  .label { font-size: 13px; color: var(--muted); }
  .counter { display: flex; align-items: center; gap: 16px; }
  .cnt-val { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; min-width: 32px; text-align: center; }
  .cnt-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--card2); border: none; color: var(--text);
    font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* STEP CARD */
  .step-card {
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 10px;
    border-left: 4px solid var(--muted);
    transition: border-color 0.2s;
  }
  .step-card.run { border-color: var(--run); }
  .step-card.jog { border-color: var(--jog); }
  .step-card.rest { border-color: var(--rest); }

  .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .step-num { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .del-btn { background: none; border: none; color: #FF2D2D; font-size: 18px; cursor: pointer; }

  .type-btns { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    flex: 1; padding: 9px 4px; border-radius: 10px; border: none;
    background: var(--card2); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .type-btn.active-run { background: var(--run); color: #fff; }
  .type-btn.active-jog { background: var(--jog); color: #fff; }
  .type-btn.active-rest { background: var(--rest); color: #fff; }

  .dur-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .dur-val { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; min-width: 72px; text-align: center; }
  .adj-btns { display: flex; gap: 6px; }
  .adj-btn {
    padding: 5px 9px; border-radius: 8px; border: none;
    background: var(--card2); color: var(--muted);
    font-size: 11px; font-weight: 700; cursor: pointer;
  }

  /* ADD STEP */
  .add-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: 2px dashed #333; background: none;
    color: var(--muted); font-size: 14px; cursor: pointer; margin-bottom: 16px;
  }

  /* SUMMARY */
  .summary {
    background: var(--card); border-radius: 18px; padding: 16px;
    display: flex; justify-content: space-around; margin-bottom: 20px;
  }
  .sum-item { text-align: center; }
  .sum-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  .sum-val { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; }

  /* START BTN */
  .start-btn {
    width: 100%; padding: 20px; border-radius: 20px;
    border: none; background: var(--run);
    color: #fff; font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 900; letter-spacing: 3px;
    cursor: pointer;
  }

  /* === TIMER SCREEN === */
  #timer-screen { display: none; }

  .phase-block {
    border-radius: 24px;
    padding: 36px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
    margin-bottom: 14px;
    transition: background 0.5s ease;
  }
  .phase-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 4px;
    opacity: 0.8; margin-bottom: 6px;
  }
  .phase-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 88px; font-weight: 900; line-height: 1;
    letter-spacing: -4px;
  }
  .phase-set { font-size: 12px; opacity: 0.7; margin-top: 8px; }
  .progress-bar {
    position: absolute; bottom: 0; left: 0; height: 5px;
    background: rgba(255,255,255,0.45);
    transition: width 1s linear;
  }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; letter-spacing: 1px; }
  .stat-val { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; }

  .next-card { background: var(--card); border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
  .next-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .next-val { font-size: 14px; font-weight: 700; }

  .gps-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 20px;
    background: var(--card); font-size: 11px; color: var(--muted);
    margin-bottom: 14px;
  }
  .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .gps-dot.active { background: var(--rest); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .stop-btn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: var(--card2); color: var(--run);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
  }

  /* === HISTORY === */
  .run-entry { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
  .run-date { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .run-stats { display: flex; gap: 20px; }
  .rs { }
  .rs-val { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; }
  .rs-label { font-size: 10px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }

  /* DRAG & DROP */
  .step-card { cursor: grab; user-select: none; }
  .step-card.dragging { opacity: 0.4; cursor: grabbing; }
  .step-card.drag-over { outline: 2px dashed #fff; }
  .drag-handle { font-size: 18px; color: var(--muted); margin-right: 8px; cursor: grab; touch-action: none; }

  .done-banner {
    background: var(--rest); border-radius: 16px; padding: 18px;
    text-align: center; margin-bottom: 14px;
  }
  .done-title { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: 2px; }

  /* === PROGRAM TAB === */
  .prog-step-indicator {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .prog-step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--card2); color: var(--muted);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .prog-step-dot.active { background: var(--run); color: #fff; transform: scale(1.15); }
  .prog-step-dot.done { background: var(--rest); color: #fff; }
  .prog-step-line { width: 18px; height: 2px; background: var(--card2); }

  .prog-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 900; letter-spacing: 2px;
    margin-bottom: 16px; text-transform: uppercase;
  }
  .prog-question { font-size: 14px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
  .prog-option-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .prog-option {
    padding: 14px 16px; border-radius: 14px; border: 2px solid var(--card2);
    background: var(--card); color: var(--text);
    font-size: 14px; cursor: pointer; text-align: left;
    transition: all 0.2s;
  }
  .prog-option.selected { border-color: var(--run); background: rgba(255,45,45,0.12); }

  .prog-option-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .prog-option-row .prog-option { text-align: center; }

  .prog-btn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    background: var(--run); color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 900; letter-spacing: 2px;
    cursor: pointer; margin-top: 8px;
  }
  .prog-btn:disabled { background: var(--card2); color: var(--muted); cursor: not-allowed; }
  .prog-btn-ghost {
    width: 100%; padding: 14px; border-radius: 16px;
    border: 2px solid var(--card2); background: none;
    color: var(--muted); font-size: 15px; cursor: pointer; margin-top: 8px;
  }

  .prog-timer-display {
    text-align: center; padding: 40px 20px;
    background: var(--card); border-radius: 24px; margin-bottom: 16px;
  }
  .prog-timer-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 96px; font-weight: 900; color: var(--run);
    line-height: 1; letter-spacing: -4px;
  }
  .prog-timer-label { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .prog-loading {
    text-align: center; padding: 60px 20px;
  }
  .prog-spinner {
    width: 48px; height: 48px; border: 4px solid var(--card2);
    border-top-color: var(--run); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* program view */
  .prog-header-card {
    background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px;
  }
  .prog-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .prog-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .prog-progress-bar-wrap { height: 8px; background: var(--card2); border-radius: 4px; margin-top: 14px; overflow: hidden; }
  .prog-progress-bar-fill { height: 100%; background: var(--rest); border-radius: 4px; transition: width 0.5s; }
  .prog-progress-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; }

  .prog-week-card {
    background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 8px;
  }
  .prog-week-header {
    display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .prog-week-title { font-weight: 700; font-size: 15px; }
  .prog-week-status { font-size: 18px; }
  .prog-week-body { margin-top: 12px; }

  .prog-workout-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--card2); cursor: pointer;
  }
  .prog-workout-row:last-child { border-bottom: none; }
  .prog-workout-label { font-size: 14px; }
  .prog-workout-check { font-size: 20px; }

  .prog-workout-detail {
    background: var(--card2); border-radius: 14px; padding: 16px; margin-top: 14px;
  }
  .prog-workout-detail-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .prog-workout-detail-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .prog-detail-btns { display: flex; gap: 8px; }
  .prog-detail-btn {
    flex: 1; padding: 11px; border-radius: 12px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .prog-detail-btn.start { background: var(--run); color: #fff; }
  .prog-detail-btn.done { background: var(--rest); color: #fff; }

  .prog-api-key-input {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: var(--card2); color: var(--text); font-size: 14px; margin-bottom: 10px;
    font-family: monospace;
  }

  .prog-result-card {
    background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px;
    text-align: center;
  }
  .prog-level-badge {
    display: inline-block; padding: 6px 16px; border-radius: 20px;
    background: var(--run); color: #fff;
    font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; margin-bottom: 10px;
  }
  .prog-level-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>

<h1>⚡ Interval Run</h1>
<p class="subtitle">カスタムインターバルトレーニング + GPS記録</p>

<div class="tabs">
  <button class="tab active" onclick="showTab('edit')">
    <span class="tab-icon">🏃</span>メニュー
  </button>
  <button class="tab" onclick="showTab('history')">
    <span class="tab-icon">📋</span>走歴
  </button>
  <button class="tab" onclick="showTab('shoes')">
    <span class="tab-icon">👟</span>シューズ
  </button>
  <button class="tab" onclick="showTab('program')">
    <span class="tab-icon">🎯</span>プログラム
  </button>
</div>

<!-- EDIT SCREEN -->
<div id="edit-screen">
  <div class="card row">
    <span class="label">セット数</span>
    <div class="counter">
      <button class="cnt-btn" onclick="adjSets(-1)">−</button>
      <span class="cnt-val" id="sets-val">4</span>
      <button class="cnt-btn" onclick="adjSets(1)">＋</button>
    </div>
  </div>

  <div id="steps-container"></div>

  <button class="add-btn" onclick="addStep()">＋ ステップを追加</button>

  <div class="summary">
    <div class="sum-item">
      <div class="sum-label">合計時間</div>
      <div class="sum-val" id="total-time-est">—</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">ステップ</div>
      <div class="sum-val" id="total-steps-est">—</div>
    </div>
  </div>

  <div class="card row" style="margin-bottom:12px">
    <span class="label">👟 シューズ</span>
    <select id="shoe-select"
      style="background:var(--card2);color:var(--text);border:none;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer">
      <option value="">選択しない</option>
    </select>
  </div>

  <button class="start-btn" onclick="startRun()">▶ START</button>
</div>

<!-- SHOES SCREEN -->
<div id="shoes-screen" style="display:none">
  <div id="shoes-list"></div>
  <div class="card" style="margin-top:8px">
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">新しいシューズを追加</div>
    <input id="shoe-name-input" type="text" placeholder="例: Nike Pegasus 41"
      style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--card2);color:var(--text);font-size:14px;margin-bottom:10px">
    <input id="shoe-limit-input" type="number" placeholder="交換目安 km（例: 800）"
      style="width:100%;padding:12px;border-radius:10px;border:none;background:var(--card2);color:var(--text);font-size:14px;margin-bottom:10px">
    <button onclick="addShoe()"
      style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--run);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;cursor:pointer">
      ＋ 追加
    </button>
  </div>
</div>

<!-- シューズ選択（スタート前） -->

<div id="timer-screen">
  <div class="gps-badge">
    <div class="gps-dot" id="gps-dot"></div>
    <span id="gps-status">GPS取得中…</span>
  </div>

  <div id="done-banner" class="done-banner" style="display:none">
    <div class="done-title">🎉 COMPLETE!</div>
    <div style="font-size:13px;margin-top:4px">お疲れさまでした</div>
  </div>

  <div class="phase-block" id="phase-block">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    <div class="phase-label" id="phase-label">READY</div>
    <div class="phase-time" id="phase-time">00:00</div>
    <div class="phase-set" id="phase-set"></div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">距離</div>
      <div class="stat-val" id="stat-dist">0.00<span style="font-size:12px">km</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">経過</div>
      <div class="stat-val" id="stat-elapsed">00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ペース</div>
      <div class="stat-val" id="stat-pace">—</div>
    </div>
  </div>

  <div class="next-card" id="next-card">
    <div>
      <div class="next-label">NEXT</div>
      <div class="next-val" id="next-val">—</div>
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:10px">
    <button class="stop-btn" onclick="stopRun()" style="flex:2">■ 終了して保存</button>
    <button id="voice-btn" onclick="toggleVoice()"
      style="flex:1;padding:16px;border-radius:16px;border:none;background:#222;color:#fff;font-size:20px;cursor:pointer">
      🔊
    </button>
  </div>
</div>

<!-- HISTORY SCREEN -->
<div id="history-screen" style="display:none">
  <div id="history-list"></div>
</div>

<!-- PROGRAM SCREEN -->
<div id="program-screen" style="display:none">
  <div id="program-content"></div>
</div>

<script>
// ===== WAKE LOCK =====
let wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && timerInterval) requestWakeLock();
});

// ===== STATE =====
let sets = 4;
let steps = [
  { id: 1, type: 'run', duration: 30 },
  { id: 2, type: 'jog', duration: 60 },
];
let nextId = 3;

// timer state
let queue = [];
let stepIdx = 0;
let timeLeft = 0;
let timerInterval = null;
let elapsedSec = 0;
let totalDistM = 0;
let gpsActive = false;
let watchId = null;
let lastPos = null;
let isDone = false;
let voiceEnabled = true;
let stepStartDistM = 0;

const COLORS = { run: '#FF2D2D', jog: '#FF8C00', rest: '#00C87A', idle: '#1C1C1E' };
const LABELS = { run: '🏃 DASH', jog: '🚶 JOG', rest: '⏸ REST' };
const SPEEDS = { run: 4.0, jog: 2.5, rest: 0 }; // m/s fallback

// ===== VOICE =====
function speak(text) {
  if (!voiceEnabled) return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 1.05;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

const VOICE_LABELS = { run: 'ダッシュ！', jog: 'ジョグ！', rest: '休憩！' };

function announceStep(step, isLast) {
  if (!step) return;
  const label = VOICE_LABELS[step.type] || '';
  const suffix = isLast ? '、ラストセットです！' : '';
  let amount;
  if ((step.mode || 'time') === 'dist') {
    const m = step.distM || 1000;
    amount = m >= 1000 ? `${(m/1000).toFixed(1)}キロ` : `${m}メートル`;
  } else {
    amount = step.duration >= 60
      ? `${Math.floor(step.duration/60)}分`
      : `${step.duration}秒`;
  }
  speak(`${label} ${amount}${suffix}`);
}

function announceCountdown(n) {
  speak(String(n));
}

// ===== TABS =====
function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['edit','history','shoes','program'][i] === tab);
  });
  document.getElementById('edit-screen').style.display = tab === 'edit' ? 'block' : 'none';
  document.getElementById('history-screen').style.display = tab === 'history' ? 'block' : 'none';
  document.getElementById('shoes-screen').style.display = tab === 'shoes' ? 'block' : 'none';
  document.getElementById('program-screen').style.display = tab === 'program' ? 'block' : 'none';
  if (tab === 'history') renderHistory();
  if (tab === 'shoes') renderShoes();
  if (tab === 'program') renderProgramTab();
}

// ===== EDIT =====
function adjSets(d) {
  sets = Math.max(1, sets + d);
  document.getElementById('sets-val').textContent = sets;
  updateSummary();
}

function addStep() {
  steps.push({ id: nextId++, type: 'run', mode: 'time', duration: 60, distM: 1000 });
  renderSteps();
}

function setMode(id, mode) {
  steps = steps.map(s => s.id === id ? { ...s, mode } : s);
  renderSteps();
}

function adjDistM(id, d) {
  steps = steps.map(s => s.id === id ? { ...s, distM: Math.max(100, (s.distM || 1000) + d) } : s);
  renderSteps();
}

function removeStep(id) {
  steps = steps.filter(s => s.id !== id);
  renderSteps();
}

function setType(id, type) {
  steps = steps.map(s => s.id === id ? { ...s, type } : s);
  renderSteps();
}

function adjDur(id, d) {
  steps = steps.map(s => s.id === id ? { ...s, duration: Math.max(10, s.duration + d) } : s);
  renderSteps();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtDist(m) {
  if (m < 1000) return Math.round(m) + 'm';
  return (m / 1000).toFixed(2) + 'km';
}

function fmtPace(distM, elapsedSec) {
  if (distM < 10) return '—';
  const secPerKm = elapsedSec / (distM / 1000);
  const m = Math.floor(secPerKm / 60), s = Math.round(secPerKm % 60);
  return `${m}'${String(s).padStart(2,'0')}`;
}

function fmtDistStep(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : m + 'm';
}

function renderSteps() {
  const c = document.getElementById('steps-container');
  c.innerHTML = steps.map((s, i) => {
    const mode = s.mode || 'time';
    const distControl = `
      <div class="dur-row">
        <span class="label">距離</span>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="adj-btns">
            <button class="adj-btn" onclick="adjDistM(${s.id},-500)">-500m</button>
            <button class="adj-btn" onclick="adjDistM(${s.id},-100)">-100m</button>
          </div>
          <span class="dur-val">${fmtDistStep(s.distM || 1000)}</span>
          <div class="adj-btns">
            <button class="adj-btn" onclick="adjDistM(${s.id},100)">+100m</button>
            <button class="adj-btn" onclick="adjDistM(${s.id},500)">+500m</button>
          </div>
        </div>
      </div>`;
    const timeControl = `
      <div class="dur-row">
        <span class="label">時間</span>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="adj-btns">
            <button class="adj-btn" onclick="adjDur(${s.id},-30)">-30s</button>
            <button class="adj-btn" onclick="adjDur(${s.id},-10)">-10s</button>
          </div>
          <span class="dur-val">${fmt(s.duration)}</span>
          <div class="adj-btns">
            <button class="adj-btn" onclick="adjDur(${s.id},10)">+10s</button>
            <button class="adj-btn" onclick="adjDur(${s.id},30)">+30s</button>
          </div>
        </div>
      </div>`;
    return `
    <div class="step-card ${s.type}" data-id="${s.id}"
      draggable="true"
      ondragstart="onDragStart(event,${s.id})"
      ondragend="onDragEnd(event)"
      ondragover="onDragOver(event,${s.id})"
      ondrop="onDrop(event,${s.id})"
      ontouchstart="onTouchStart(event,${s.id})"
      ontouchmove="onTouchMove(event)"
      ontouchend="onTouchEnd()">
      <div class="step-header">
        <span><span class="drag-handle">⠿</span><span class="step-num">STEP ${i + 1}</span></span>
        <button class="del-btn" onclick="removeStep(${s.id})">✕</button>
      </div>
      <div class="type-btns">
        ${['run','jog','rest'].map(t => `
          <button class="type-btn ${s.type === t ? 'active-' + t : ''}"
            onclick="setType(${s.id},'${t}')">
            ${ t === 'run' ? '🏃 ダッシュ' : t === 'jog' ? '🚶 ジョグ' : '⏸ 休憩'}
          </button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="adj-btn" onclick="setMode(${s.id},'time')"
          style="flex:1;padding:8px;border-radius:10px;${mode==='time'?'background:var(--card2);color:var(--text);':''}">
          ⏱ 時間
        </button>
        <button class="adj-btn" onclick="setMode(${s.id},'dist')"
          style="flex:1;padding:8px;border-radius:10px;${mode==='dist'?'background:var(--card2);color:var(--text);':''}">
          📍 距離
        </button>
      </div>
      ${mode === 'dist' ? distControl : timeControl}
    </div>`;
  }).join('');
  updateSummary();
}

function updateSummary() {
  const timeSec = steps.filter(s => (s.mode||'time')==='time').reduce((a, s) => a + s.duration, 0) * sets;
  const distM   = steps.filter(s => s.mode==='dist').reduce((a, s) => a + (s.distM||1000), 0) * sets;
  let label = '';
  if (timeSec > 0 && distM > 0) label = fmt(timeSec) + '＋' + fmtDistStep(distM);
  else if (distM > 0)            label = fmtDistStep(distM);
  else                           label = fmt(timeSec);
  document.getElementById('total-time-est').textContent = label;
  document.getElementById('total-steps-est').textContent = `${steps.length} × ${sets}`;
}

// ===== TIMER =====
function buildQueue() {
  const q = [];
  for (let s = 0; s < sets; s++) {
    steps.forEach(step => q.push({ ...step, setNum: s + 1 }));
  }
  return q;
}

function startRun() {
  if (steps.length === 0) return;
  queue = buildQueue();
  stepIdx = 0;
  elapsedSec = 0;
  totalDistM = 0;
  lastPos = null;
  isDone = false;

  document.getElementById('edit-screen').style.display = 'none';
  document.getElementById('timer-screen').style.display = 'block';
  document.getElementById('done-banner').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.style.display = 'none');

  requestWakeLock();
  startGPS();
  speak('トレーニングを開始します！');
  loadStep();
  timerInterval = setInterval(tick, 1000);
}

function loadStep() {
  const cur = queue[stepIdx];
  if (!cur) return;
  timeLeft = cur.duration;
  stepStartDistM = totalDistM;
  const isLast = cur.setNum === sets && stepIdx === queue.length - 1;
  announceStep(cur, isLast);
  updatePhaseUI();
  updateNextUI();
}

function tick() {
  elapsedSec++;

  const cur = queue[stepIdx];
  const mode = cur?.mode || 'time';

  // fallback distance if no GPS
  if (!gpsActive && cur) totalDistM += SPEEDS[cur.type];

  updatePhaseUI();
  updateStats();

  if (mode === 'dist') {
    const traveled = totalDistM - stepStartDistM;
    const target = cur.distM || 1000;
    const remaining = Math.max(0, target - traveled);
    // countdown voice near finish
    if (remaining <= 50 && remaining > 0 && Math.round(remaining) % 10 === 0) {
      speak(Math.round(remaining) + 'メートル');
    }
    if (traveled >= target) {
      stepIdx++;
      if (stepIdx >= queue.length) finishRun();
      else loadStep();
    }
  } else {
    timeLeft--;
    if (timeLeft <= 3 && timeLeft > 0) announceCountdown(timeLeft);
    if (timeLeft <= 0) {
      stepIdx++;
      if (stepIdx >= queue.length) finishRun();
      else loadStep();
    }
  }
}

function updatePhaseUI() {
  const cur = queue[stepIdx];
  if (!cur) return;
  const block = document.getElementById('phase-block');
  block.style.background = COLORS[cur.type];
  document.getElementById('phase-label').textContent = LABELS[cur.type];
  document.getElementById('phase-set').textContent = `セット ${cur.setNum} / ${sets}`;

  const mode = cur.mode || 'time';
  if (mode === 'dist') {
    const traveled = totalDistM - stepStartDistM;
    const target = cur.distM || 1000;
    const remaining = Math.max(0, target - traveled);
    document.getElementById('phase-time').textContent = fmtDistStep(Math.round(remaining));
    const pct = Math.min(100, (traveled / target * 100)).toFixed(1);
    document.getElementById('progress-bar').style.width = pct + '%';
  } else {
    document.getElementById('phase-time').textContent = fmt(timeLeft);
    const pct = ((cur.duration - timeLeft) / cur.duration * 100).toFixed(1);
    document.getElementById('progress-bar').style.width = pct + '%';
  }
}

function updateNextUI() {
  const next = queue[stepIdx + 1];
  if (next) {
    document.getElementById('next-val').textContent =
      `${LABELS[next.type]}  ${fmt(next.duration)}`;
  } else {
    document.getElementById('next-val').textContent = 'ラスト！';
  }
}

function updateStats() {
  document.getElementById('stat-dist').innerHTML =
    (totalDistM / 1000).toFixed(2) + '<span style="font-size:12px">km</span>';
  document.getElementById('stat-elapsed').textContent = fmt(elapsedSec);
  document.getElementById('stat-pace').textContent = fmtPace(totalDistM, elapsedSec);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  document.getElementById('voice-btn').textContent = voiceEnabled ? '🔊' : '🔇';
}

function finishRun() {
  clearInterval(timerInterval);
  stopGPS();
  releaseWakeLock();
  isDone = true;
  speak('お疲れさまでした！トレーニング完了です！');
  document.getElementById('done-banner').style.display = 'block';
  document.getElementById('phase-block').style.background = '#00C87A';
  document.getElementById('phase-label').textContent = 'COMPLETE';
  document.getElementById('phase-time').textContent = '🎉';
  saveRun();
}

async function stopRun() {
  if (!confirm('トレーニングを終了して記録を保存しますか？')) return;
  clearInterval(timerInterval);
  stopGPS();
  if (!isDone) await saveRun();
  document.getElementById('timer-screen').style.display = 'none';
  document.getElementById('edit-screen').style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.style.display = '');
  releaseWakeLock();
}

// ===== GPS =====
function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('gps-status').textContent = 'GPS非対応';
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    pos => {
      if (!gpsActive) {
        gpsActive = true;
        document.getElementById('gps-dot').classList.add('active');
        document.getElementById('gps-status').textContent = 'GPS取得中';
      }
      if (lastPos) {
        const d = calcDist(lastPos, pos.coords);
        // filter noise: ignore jumps > 50m/s
        if (d < 50) totalDistM += d;
      }
      lastPos = pos.coords;
      updateStats();
    },
    err => {
      document.getElementById('gps-status').textContent = 'GPS取得失敗（推定値使用）';
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

function stopGPS() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  gpsActive = false;
}

function calcDist(c1, c2) {
  const R = 6371000;
  const dLat = (c2.latitude - c1.latitude) * Math.PI / 180;
  const dLon = (c2.longitude - c1.longitude) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
    Math.cos(c1.latitude * Math.PI/180) * Math.cos(c2.latitude * Math.PI/180) *
    Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ===== WEATHER =====
async function fetchWeather(lat, lon) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m&timezone=auto`;
    const res = await fetch(url);
    const data = await res.json();
    const c = data.current;
    return {
      temp: Math.round(c.temperature_2m),
      wind: Math.round(c.windspeed_10m),
      code: c.weathercode,
      icon: weatherIcon(c.weathercode),
    };
  } catch(e) {
    return null;
  }
}

function weatherIcon(code) {
  if (code === 0) return '☀️';
  if (code <= 2) return '🌤';
  if (code <= 3) return '☁️';
  if (code <= 49) return '🌫';
  if (code <= 59) return '🌦';
  if (code <= 69) return '🌧';
  if (code <= 79) return '🌨';
  if (code <= 82) return '🌧';
  if (code <= 99) return '⛈';
  return '🌡';
}

// ===== HISTORY =====
async function saveRun() {
  let weather = null;
  // 位置情報があれば天気取得
  const pos = lastPos;
  if (pos) {
    weather = await fetchWeather(pos.latitude, pos.longitude);
  }

  const shoeId = document.getElementById('shoe-select')?.value || null;
  if (shoeId) addDistToShoe(shoeId, totalDistM);

  const record = {
    date: new Date().toISOString(),
    distM: totalDistM,
    elapsedSec,
    steps: steps.map(s => ({ type: s.type, duration: s.duration })),
    sets,
    gps: gpsActive,
    weather,
    shoeId,
    shoeName: shoeId ? (getShoes().find(s => s.id == shoeId)?.name || '') : '',
  };
  let history = [];
  try { history = JSON.parse(localStorage.getItem('interval-run-history') || '[]'); } catch(e) {}
  history.unshift(record);
  try { localStorage.setItem('interval-run-history', JSON.stringify(history.slice(0, 100))); } catch(e) {
    console.warn('localStorage full, trimming history');
    try { localStorage.setItem('interval-run-history', JSON.stringify(history.slice(0, 20))); } catch(e2) {}
  }
}

function deleteHistory(idx) {
  let history = [];
  try { history = JSON.parse(localStorage.getItem('interval-run-history') || '[]'); } catch(e) {}
  history.splice(idx, 1);
  try { localStorage.setItem('interval-run-history', JSON.stringify(history)); } catch(e) {}
  renderHistory();
}

function renderHistory() {
  let history = [];
  try { history = JSON.parse(localStorage.getItem('interval-run-history') || '[]'); } catch(e) {}
  const el = document.getElementById('history-list');
  if (history.length === 0) {
    el.innerHTML = '<div class="empty">まだ記録がありません<br>走ってみよう！🏃</div>';
    return;
  }
  el.innerHTML = history.map((r, idx) => {
    const d = new Date(r.date);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `
      <div class="run-entry">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="run-date">${dateStr} ${r.gps ? '📍GPS' : '📐推定'}${r.weather ? `　${r.weather.icon} ${r.weather.temp}℃ 風${r.weather.wind}km/h` : ''}${r.shoeName ? `　👟 ${esc(r.shoeName)}` : ''}</div>
          <button onclick="if(confirm('この記録を削除しますか？'))deleteHistory(${idx})"
            style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0;padding:0 0 0 8px">✕</button>
        </div>
        <div class="run-stats">
          <div class="rs">
            <div class="rs-val">${(r.distM/1000).toFixed(2)}<span style="font-size:12px">km</span></div>
            <div class="rs-label">距離</div>
          </div>
          <div class="rs">
            <div class="rs-val">${fmt(r.elapsedSec)}</div>
            <div class="rs-label">時間</div>
          </div>
          <div class="rs">
            <div class="rs-val">${fmtPace(r.distM, r.elapsedSec)}</div>
            <div class="rs-label">ペース/km</div>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ===== SHOES =====
function getShoes() {
  return JSON.parse(localStorage.getItem('interval-shoes') || '[]');
}
function saveShoes(shoes) {
  localStorage.setItem('interval-shoes', JSON.stringify(shoes));
}

function addShoe() {
  const name = document.getElementById('shoe-name-input').value.trim();
  const limit = parseFloat(document.getElementById('shoe-limit-input').value) || 800;
  if (!name) return;
  const shoes = getShoes();
  shoes.push({ id: Date.now(), name, limitKm: limit, distM: 0 });
  saveShoes(shoes);
  document.getElementById('shoe-name-input').value = '';
  document.getElementById('shoe-limit-input').value = '';
  renderShoes();
  updateShoeSelect();
}

function deleteShoe(id) {
  saveShoes(getShoes().filter(s => s.id !== id));
  renderShoes();
  updateShoeSelect();
}

function renderShoes() {
  const shoes = getShoes();
  const el = document.getElementById('shoes-list');
  if (shoes.length === 0) {
    el.innerHTML = '<div class="empty">シューズが登録されていません</div>';
    return;
  }
  el.innerHTML = shoes.map(s => {
    const km = (s.distM / 1000).toFixed(1);
    const pct = Math.min(100, (s.distM / 1000) / s.limitKm * 100);
    const color = pct > 90 ? 'var(--run)' : pct > 70 ? 'var(--jog)' : 'var(--rest)';
    return `
      <div class="run-entry">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-weight:700;font-size:15px">👟 ${esc(s.name)}</div>
          <button onclick="deleteShoe(${s.id})"
            style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer">✕</button>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px">
          <span>${km} km 走行</span>
          <span>目安 ${s.limitKm} km</span>
        </div>
        <div style="height:6px;background:var(--card2);border-radius:3px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width 0.4s"></div>
        </div>
        ${pct > 90 ? '<div style="font-size:11px;color:var(--run);margin-top:6px">⚠️ そろそろ交換時期です</div>' : ''}
      </div>`;
  }).join('');
}

function updateShoeSelect() {
  const shoes = getShoes();
  const sel = document.getElementById('shoe-select');
  const cur = sel.value;
  sel.innerHTML = '<option value="">選択しない</option>' +
    shoes.map(s => `<option value="${s.id}" ${cur == s.id ? 'selected' : ''}>${esc(s.name)} (${(s.distM/1000).toFixed(0)}km)</option>`).join('');
}

function addDistToShoe(shoeId, distM) {
  if (!shoeId) return;
  const shoes = getShoes();
  const s = shoes.find(s => s.id == shoeId);
  if (s) { s.distM += distM; saveShoes(shoes); }
}

// ===== DRAG & DROP =====
let dragSrcId = null;

function onDragStart(e, id) {
  dragSrcId = id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer && (e.dataTransfer.effectAllowed = 'move');
}
function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('drag-over'));
}
function onDragOver(e, id) {
  e.preventDefault();
  if (dragSrcId === id) return;
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDrop(e, id) {
  e.preventDefault();
  if (dragSrcId === id) return;
  const from = steps.findIndex(s => s.id === dragSrcId);
  const to   = steps.findIndex(s => s.id === id);
  if (from < 0 || to < 0) return;
  const moved = steps.splice(from, 1)[0];
  steps.splice(to, 0, moved);
  renderSteps();
}

// Touch drag support
let touchDragId = null, touchClone = null, touchTargetId = null;
function onTouchStart(e, id) {
  // ハンドル以外からのタッチは無視
  if (!e.target.classList.contains('drag-handle')) return;
  touchDragId = id;
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  touchClone = card.cloneNode(true);
  touchClone.style.cssText = `position:fixed;top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;opacity:0.8;pointer-events:none;z-index:9999;transition:none;`;
  document.body.appendChild(touchClone);
  card.style.opacity = '0.3';
}
function onTouchMove(e) {
  if (!touchClone || !touchDragId) return;
  e.preventDefault();
  const t = e.touches[0];
  touchClone.style.top = (t.clientY - 30) + 'px';
  touchClone.style.display = 'none';
  const el = document.elementFromPoint(t.clientX, t.clientY);
  touchClone.style.display = '';
  const card = el?.closest('.step-card');
  document.querySelectorAll('.step-card').forEach(c => c.classList.remove('drag-over'));
  if (card) {
    const id = parseInt(card.dataset.id);
    touchTargetId = id;
    if (id !== touchDragId) card.classList.add('drag-over');
  }
}
function onTouchEnd() {
  if (!touchDragId) return;
  if (touchClone) { touchClone.remove(); touchClone = null; }
  document.querySelectorAll('.step-card').forEach(c => { c.style.opacity = ''; c.classList.remove('drag-over'); });
  if (touchDragId && touchTargetId && touchDragId !== touchTargetId) {
    const from = steps.findIndex(s => s.id === touchDragId);
    const to   = steps.findIndex(s => s.id === touchTargetId);
    if (from >= 0 && to >= 0) { const m = steps.splice(from,1)[0]; steps.splice(to,0,m); }
  }
  touchDragId = null; touchTargetId = null;
  renderSteps();
}

// ===== INIT =====
renderSteps();
renderShoes();
updateShoeSelect();

// ===== PROGRAM FEATURE =====
let progWizardStep = 1; // 1〜5
let progFitness = {
  frequency: null,  // A/B/C/D
  pace5k: null,     // A/B/C/D
  cooperM: null,    // number or null
  goal: null,       // key string
  goalTime: null,   // '25:00' etc
  daysPerWeek: null,// 2/3/4/5
  weeks: null,      // 4/8/12
};
let progCooperTimerInterval = null;
let progCooperSec = 720; // 12min
let progCooperRunning = false;

function getProgram() {
  try { return JSON.parse(localStorage.getItem('interval-program') || 'null'); } catch(e) { return null; }
}
function saveProgram(p) {
  localStorage.setItem('interval-program', JSON.stringify(p));
}
function getApiKey() {
  return localStorage.getItem('interval-api-key') || '';
}
function saveApiKey(k) {
  localStorage.setItem('interval-api-key', k);
}

function renderProgramTab() {
  const prog = getProgram();
  if (prog) {
    renderProgramView(prog);
  } else {
    renderWizard();
  }
}

// ===== WIZARD =====
function renderWizard() {
  const c = document.getElementById('program-content');
  const step = progWizardStep;

  const dots = [1,2,3,4,5].map(i => {
    let cls = '';
    if (i < step) cls = 'done';
    else if (i === step) cls = 'active';
    return `<div class="prog-step-dot ${cls}">${i < step ? '✓' : i}</div>${i < 5 ? '<div class="prog-step-line"></div>' : ''}`;
  }).join('');

  let body = '';

  if (step === 1) {
    body = `
      <div class="prog-section-title">STEP 1 フィットネス診断</div>
      <div class="prog-question">今のランニング状況は？</div>
      <div class="prog-option-grid">
        ${[
          ['A','ほとんど走っていない'],
          ['B','月に数回走る'],
          ['C','週1〜2回走る'],
          ['D','週3回以上定期的に走る'],
        ].map(([k,v]) => `<button class="prog-option${progFitness.frequency===k?' selected':''}" onclick="progSelect('frequency','${k}',this)">${k}）${v}</button>`).join('')}
      </div>
      <div class="prog-question">5kmを走ったとしたら、どのくらいかかりそう？</div>
      <div class="prog-option-grid">
        ${[
          ['A','40分以上（または走り切れない）'],
          ['B','30〜40分'],
          ['C','25〜30分'],
          ['D','25分以内'],
        ].map(([k,v]) => `<button class="prog-option${progFitness.pace5k===k?' selected':''}" onclick="progSelect('pace5k','${k}',this)">${k}）${v}</button>`).join('')}
      </div>
      <button class="prog-btn" onclick="progNextStep()" ${progFitness.frequency&&progFitness.pace5k?'':'disabled'}>次へ →</button>
    `;
  } else if (step === 2) {
    body = `
      <div class="prog-section-title">STEP 2 クーパーテスト（任意）</div>
      <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px">
        より正確な診断のために、12分間できるだけ遠くを走るテストをします。<br>
        平らな場所で走れる方はぜひ試してください。
      </p>
      <div id="cooper-area">
        <button class="prog-btn" onclick="startCooperTimer()" id="cooper-start-btn">▶ テストをする</button>
        <button class="prog-btn-ghost" onclick="progNextStep()">スキップ →</button>
      </div>
    `;
  } else if (step === 3) {
    body = `
      <div class="prog-section-title">STEP 3 目標設定</div>
      <div class="prog-question">目標を選んでください</div>
      <div class="prog-option-grid">
        ${[
          ['finish5k','🏃 5kmを完走したい'],
          ['faster5k','⚡ 5kmのタイムを縮めたい'],
          ['finish10k','🏆 10kmを完走したい'],
          ['fitness','💪 体力をつけたい'],
        ].map(([k,v]) => `<button class="prog-option${progFitness.goal===k?' selected':''}" onclick="progSelectGoal('${k}',this)">${v}</button>`).join('')}
      </div>
      <div id="goal-time-area" style="display:${progFitness.goal==='faster5k'?'block':'none'};margin-bottom:16px">
        <div class="prog-question">目標タイムを入力（例: 25:00）</div>
        <input id="goal-time-input" type="text" placeholder="25:00" value="${progFitness.goalTime||''}"
          style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--card2);color:var(--text);font-size:18px;font-family:'Barlow Condensed',sans-serif;font-weight:700;margin-bottom:4px"
          oninput="progFitness.goalTime=this.value">
      </div>
      <div class="prog-question">週何回走れますか？</div>
      <div class="prog-option-row">
        ${[2,3,4,5].map(n => `<button class="prog-option${progFitness.daysPerWeek===n?' selected':''}" onclick="progSelect('daysPerWeek',${n},this)">${n}回</button>`).join('')}
      </div>
      <div class="prog-question">何週間のプログラムにしますか？</div>
      <div class="prog-option-row">
        ${[4,8,12].map(n => `<button class="prog-option${progFitness.weeks===n?' selected':''}" onclick="progSelect('weeks',${n},this)">${n}週間</button>`).join('')}
      </div>
      <button class="prog-btn" onclick="progNextStep()" ${progFitness.goal&&progFitness.daysPerWeek&&progFitness.weeks?'':'disabled'}>次へ →</button>
    `;
  } else if (step === 4) {
    const hasKey = !!getApiKey();
    body = `
      <div class="prog-section-title">STEP 4 Claude API Key</div>
      ${hasKey
        ? `<div style="background:rgba(0,200,122,0.1);border-radius:12px;padding:14px;margin-bottom:20px;font-size:13px;color:var(--rest)">✓ APIキーが設定済みです</div>`
        : `<p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px">
            プログラム生成にはClaude APIキーが必要です。<br>
            <a href="https://console.anthropic.com" target="_blank" style="color:var(--run)">console.anthropic.com</a> で取得できます。
          </p>`
      }
      <input class="prog-api-key-input" type="password" id="api-key-input"
        placeholder="sk-ant-..." value="${getApiKey()}"
        oninput="saveApiKey(this.value)">
      <button class="prog-btn" onclick="progNextStep()" ${hasKey||true?'':'disabled'}>生成する →</button>
    `;
  } else if (step === 5) {
    body = `
      <div class="prog-loading" id="prog-loading">
        <div class="prog-spinner"></div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">🤖 AIがプログラムを作成中...</div>
        <div style="font-size:13px;color:var(--muted)">あなたのデータを分析しています</div>
      </div>
    `;
    // Auto-trigger generation
    setTimeout(() => generateProgram(), 100);
  }

  c.innerHTML = `
    <div class="prog-step-indicator">${dots}</div>
    ${body}
  `;
}

function progSelect(key, val, btn) {
  progFitness[key] = val;
  // update sibling buttons
  const siblings = btn.parentElement.querySelectorAll('.prog-option');
  siblings.forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  renderWizard();
}

function progSelectGoal(key, btn) {
  progFitness.goal = key;
  const siblings = btn.parentElement.querySelectorAll('.prog-option');
  siblings.forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('goal-time-area').style.display = key === 'faster5k' ? 'block' : 'none';
  // refresh btn state
  const nextBtn = btn.closest('#program-content').querySelector('.prog-btn');
  if (nextBtn) nextBtn.disabled = !(progFitness.goal && progFitness.daysPerWeek && progFitness.weeks);
}

function progNextStep() {
  // Validate api key before step 5
  if (progWizardStep === 4) {
    const inp = document.getElementById('api-key-input');
    if (inp && inp.value.trim()) saveApiKey(inp.value.trim());
    if (!getApiKey()) {
      alert('APIキーを入力してください');
      return;
    }
  }
  progWizardStep++;
  renderWizard();
}

// ===== COOPER TIMER =====
function startCooperTimer() {
  progCooperSec = 720;
  progCooperRunning = true;
  const area = document.getElementById('cooper-area');
  area.innerHTML = `
    <div class="prog-timer-display">
      <div class="prog-timer-num" id="cooper-time">12:00</div>
      <div class="prog-timer-label">12分間走テスト</div>
    </div>
    <button class="prog-btn-ghost" id="cooper-stop-btn" onclick="stopCooperTimer()">■ 終了</button>
  `;
  progCooperTimerInterval = setInterval(() => {
    progCooperSec--;
    const m = Math.floor(progCooperSec / 60), s = progCooperSec % 60;
    const el = document.getElementById('cooper-time');
    if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (progCooperSec <= 0) {
      clearInterval(progCooperTimerInterval);
      speak('テスト終了です！');
      showCooperResult();
    }
  }, 1000);
  speak('12分間走テスト開始！');
  requestWakeLock();
}

function stopCooperTimer() {
  clearInterval(progCooperTimerInterval);
  showCooperResult();
}

function showCooperResult() {
  releaseWakeLock();
  const area = document.getElementById('cooper-area');
  area.innerHTML = `
    <div class="prog-question">何メートル走れましたか？</div>
    <input type="number" id="cooper-dist-input" placeholder="例: 1800"
      style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--card2);color:var(--text);font-size:22px;font-family:'Barlow Condensed',sans-serif;font-weight:700;margin-bottom:10px;text-align:center"
      oninput="progFitness.cooperM=parseInt(this.value)||null">
    <div id="cooper-judge" style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px"></div>
    <button class="prog-btn" onclick="progNextStep()">次へ →</button>
  `;
  // live judgment
  const inp = area.querySelector('input');
  inp.addEventListener('input', () => {
    const m = parseInt(inp.value) || 0;
    const el = document.getElementById('cooper-judge');
    if (m >= 2400) el.textContent = '🏅 エリート級！';
    else if (m >= 2100) el.textContent = '⭐ 優秀';
    else if (m >= 1600) el.textContent = '👍 平均的';
    else el.textContent = '🌱 これから伸びていきましょう';
    el.style.color = m >= 2100 ? 'var(--rest)' : m >= 1600 ? 'var(--jog)' : 'var(--muted)';
  });
}

// ===== GENERATE PROGRAM =====
async function generateProgram() {
  const f = progFitness;
  const freqMap = { A: 'ほとんど走っていない', B: '月に数回走る', C: '週1〜2回走る', D: '週3回以上定期的に走る' };
  const paceMap = { A: '40分以上（または走り切れない）', B: '30〜40分', C: '25〜30分', D: '25分以内' };
  const goalMap = { finish5k: '5kmを完走したい', faster5k: `5kmを${f.goalTime||''}で走りたい`, finish10k: '10kmを完走したい', fitness: '体力をつけたい' };

  let cooperLine = '';
  if (f.cooperM) cooperLine = `クーパーテスト：${f.cooperM}m`;

  const prompt = `あなたはランニングコーチです。以下のデータを元に、パーソナライズされたランニングプログラムを作成してください。

【診断結果】
ランニング頻度：${freqMap[f.frequency] || '不明'}
5km推定タイム：${paceMap[f.pace5k] || '不明'}
${cooperLine}
目標：${goalMap[f.goal] || '不明'}
週の練習回数：${f.daysPerWeek}回
期間：${f.weeks}週間

以下のJSON形式で返してください。他のテキストは不要です：
{
  "level": "初級",
  "levelDesc": "レベルの説明（2〜3文）",
  "weeks": [
    {
      "week": 1,
      "theme": "週のテーマ",
      "workouts": [
        {
          "id": "w1d1",
          "dayLabel": "1回目",
          "title": "ワークアウトタイトル",
          "description": "内容の説明（2〜3文）",
          "steps": [
            {"type": "jog", "mode": "time", "duration": 1800, "distM": 0}
          ],
          "sets": 1
        }
      ]
    }
  ]
}

typeはrun/jog/restのいずれか。modeはtime（durationは秒）またはdist（distMはメートル）。全${f.weeks}週分を作成すること。`;

  try {
    const apiKey = getApiKey();
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 8000,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${res.status}`);
    }

    const data = await res.json();
    const text = data.content[0].text.trim();
    // extract JSON
    const jsonStr = text.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'');
    const prog = JSON.parse(jsonStr);
    prog.goal = f.goal;
    prog.weeks_total = f.weeks;
    prog.created = new Date().toISOString();
    saveProgram(prog);
    saveApiKey(apiKey);

    // Show result
    const c = document.getElementById('program-content');
    c.innerHTML = `
      <div class="prog-result-card">
        <div class="prog-level-badge">${prog.level}</div>
        <div class="prog-level-desc">${prog.levelDesc}</div>
      </div>
      <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px">プログラムが作成されました！</div>
      <button class="prog-btn" onclick="renderProgramView(getProgram())">プログラムを見る →</button>
    `;
  } catch(e) {
    document.getElementById('program-content').innerHTML = `
      <div style="background:rgba(255,45,45,0.1);border-radius:14px;padding:20px;text-align:center;margin-bottom:20px">
        <div style="font-size:16px;font-weight:700;color:var(--run);margin-bottom:8px">エラーが発生しました</div>
        <div style="font-size:12px;color:var(--muted)">${esc(e.message)}</div>
      </div>
      <button class="prog-btn" onclick="progWizardStep=4;renderWizard()">← APIキーを確認</button>
    `;
  }
}

// ===== PROGRAM VIEW =====
let expandedWeek = null;
let expandedWorkout = null;

function renderProgramView(prog) {
  if (!prog) return;
  const c = document.getElementById('program-content');

  // calc progress
  let totalWorkouts = 0, doneWorkouts = 0;
  prog.weeks.forEach(w => {
    w.workouts.forEach(wo => {
      totalWorkouts++;
      if (wo.done) doneWorkouts++;
    });
  });
  const pct = totalWorkouts > 0 ? Math.round(doneWorkouts / totalWorkouts * 100) : 0;
  const bar = '█'.repeat(Math.round(pct / 10)) + '░'.repeat(10 - Math.round(pct / 10));

  // find current week (first incomplete)
  let currentWeekIdx = prog.weeks.findIndex(w => w.workouts.some(wo => !wo.done));
  if (currentWeekIdx < 0) currentWeekIdx = prog.weeks.length - 1;
  if (expandedWeek === null) expandedWeek = currentWeekIdx;

  const goalLabels = { finish5k: '5km完走', faster5k: '5kmタイム更新', finish10k: '10km完走', fitness: '体力アップ' };

  const weeksHtml = prog.weeks.map((w, wi) => {
    const allDone = w.workouts.every(wo => wo.done);
    const isCurrent = wi === currentWeekIdx;
    const isExpanded = wi === expandedWeek;
    const isLocked = wi > currentWeekIdx && !allDone;

    let statusIcon = allDone ? '✅' : isCurrent ? '🏃' : isLocked ? '🔒' : '⬜';

    let bodyHtml = '';
    if (isExpanded && !isLocked) {
      const workoutsHtml = w.workouts.map((wo, doi) => {
        const isExpandedWo = expandedWorkout === `${wi}-${doi}`;
        const check = wo.done ? '✅' : '⬜';
        let detailHtml = '';
        if (isExpandedWo) {
          const stepsText = wo.steps.map(s => {
            const t = s.type === 'run' ? '🏃ダッシュ' : s.type === 'jog' ? '🚶ジョグ' : '⏸休憩';
            const amt = s.mode === 'dist' ? `${s.distM}m` : fmt(s.duration);
            return `${t} ${amt}`;
          }).join('、');
          detailHtml = `
            <div class="prog-workout-detail">
              <div class="prog-workout-detail-title">${esc(wo.title)}</div>
              <div class="prog-workout-detail-desc">${esc(wo.description)}<br><span style="font-size:11px;color:var(--muted)">${stepsText}</span></div>
              <div class="prog-detail-btns">
                <button class="prog-detail-btn start" onclick="launchWorkout(${wi},${doi})">▶ タイマーで開始</button>
                <button class="prog-detail-btn done" onclick="markWorkoutDone(${wi},${doi})">${wo.done ? '✓ 完了済み' : '✅ 完了にする'}</button>
              </div>
            </div>`;
        }
        return `
          <div class="prog-workout-row" onclick="toggleWorkout(${wi},${doi})">
            <span class="prog-workout-label">${esc(wo.dayLabel)}：${esc(wo.title)}</span>
            <span class="prog-workout-check">${check}</span>
          </div>
          ${detailHtml}`;
      }).join('');
      bodyHtml = `<div class="prog-week-body">${workoutsHtml}</div>`;
    }

    return `
      <div class="prog-week-card">
        <div class="prog-week-header" onclick="toggleWeek(${wi})">
          <span class="prog-week-title">Week ${w.week}　<span style="font-size:12px;color:var(--muted);font-weight:400">${esc(w.theme)}</span></span>
          <span class="prog-week-status">${statusIcon}</span>
        </div>
        ${bodyHtml}
      </div>`;
  }).join('');

  c.innerHTML = `
    <div class="prog-header-card">
      <div class="prog-title">📋 ${prog.weeks_total}週間プログラム</div>
      <div class="prog-meta">${goalLabels[prog.goal] || ''}　レベル：${prog.level}</div>
      <div class="prog-progress-bar-wrap">
        <div class="prog-progress-bar-fill" style="width:${pct}%"></div>
      </div>
      <div class="prog-progress-label">${bar} ${pct}%　${doneWorkouts}/${totalWorkouts}回完了</div>
    </div>
    ${weeksHtml}
    <button class="prog-btn-ghost" style="margin-top:16px" onclick="if(confirm('プログラムをリセットして最初からやり直しますか？')){localStorage.removeItem('interval-program');progWizardStep=1;progFitness={frequency:null,pace5k:null,cooperM:null,goal:null,goalTime:null,daysPerWeek:null,weeks:null};expandedWeek=null;expandedWorkout=null;renderProgramTab()}">
      🔄 プログラムをリセット
    </button>
  `;
}

function toggleWeek(wi) {
  expandedWeek = expandedWeek === wi ? null : wi;
  expandedWorkout = null;
  renderProgramView(getProgram());
}

function toggleWorkout(wi, doi) {
  const key = `${wi}-${doi}`;
  expandedWorkout = expandedWorkout === key ? null : key;
  renderProgramView(getProgram());
}

function markWorkoutDone(wi, doi) {
  const prog = getProgram();
  if (!prog) return;
  const wo = prog.weeks[wi].workouts[doi];
  wo.done = !wo.done;
  wo.doneAt = wo.done ? new Date().toISOString() : null;
  saveProgram(prog);
  expandedWorkout = null;
  renderProgramView(prog);
}

function launchWorkout(wi, doi) {
  const prog = getProgram();
  if (!prog) return;
  const wo = prog.weeks[wi].workouts[doi];

  // Override global steps/sets and switch to edit tab
  steps = wo.steps.map((s, i) => ({ id: i + 1, type: s.type, mode: s.mode || 'time', duration: s.duration || 60, distM: s.distM || 1000 }));
  nextId = steps.length + 1;
  sets = wo.sets || 1;
  document.getElementById('sets-val').textContent = sets;
  renderSteps();

  // Switch to menu tab and start
  showTab('edit');
  setTimeout(() => startRun(), 100);
}
